[package]
name = "shook"
version = "1.0.1"
edition = "2024"
description = "Lost your pointer? Shake the mouse and Shook brings it to you."
license = "MIT"
repository = "https://github.com/AcidAlchamy/shook"
homepage = "https://acidalchamy.com/donationware/shook/"
authors = ["Acid Alchamy"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
eframe = { version = "0.37", default-features = false, features = ["glow"] }
raw-window-handle = "0.6"

[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
